<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
<head>
<meta charset="utf-8">
<title>Student sign-in · Cold War History Resources</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@800;900&family=Courier+Prime&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#EDF0F2;--surface:#FAFBFC;--sunk:#E2E7EB;--ink:#16202B;--muted:#56626F;--line:#C9D1D8;
  --west:#1F4E9C;--east:#B3261E;--ice:#1F7188;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Verdana,sans-serif;
  --mono:"Courier Prime","Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;--paper:#0F151B;--surface:#17202A;--sunk:#111A22;--ink:#E5EBF0;--muted:#9DAAB7;--line:#2D3B48;--west:#86ABF2;--east:#F2887E;--ice:#6CC4D8}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px}
.hidden{display:none!important}
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.panel{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ice);border-radius:12px;padding:28px 24px}
.kicker{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:2.6rem;line-height:.92;margin:6px 0 12px}
.split{height:5px;display:grid;grid-template-columns:1fr 1fr;width:140px;margin-bottom:16px}
.split i:first-child{background:var(--west)}.split i:last-child{background:var(--east)}
.note{margin:0 0 20px;color:var(--muted);font-size:.95rem}
label.field{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.pw{display:flex;border:1px solid var(--line);border-radius:8px;background:var(--sunk);overflow:hidden}
.pw:focus-within{outline:3px solid var(--ice);outline-offset:1px}
.pw input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:12px 14px;outline:0}
.pw button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:0 14px;cursor:pointer}
.pw button:focus-visible{outline:2px solid var(--ice)}
.error{color:var(--east);font-size:.9rem;margin:8px 0 0;min-height:1.3em}
.remember{display:flex;align-items:center;gap:10px;margin:10px 0 18px;font-size:.95rem}
.remember input{width:18px;height:18px;accent-color:var(--ice)}
.go{width:100%;border:0;border-radius:8px;background:var(--ice);color:#fff;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:1.25rem;padding:12px;cursor:pointer}
@media (prefers-color-scheme: dark){.go{color:#0F151B}}
.go:hover{filter:brightness(1.08)}
.go:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.foot{margin-top:18px;font-size:.8rem;color:var(--muted)}
.spinner{width:2rem;height:2rem;border:.25em solid var(--line);border-right-color:transparent;border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="staticrypt-body">
<div id="staticrypt_loading" class="center"><div class="spinner" aria-label="Loading"></div></div>

<div id="staticrypt_content" class="center hidden">
  <main class="panel">
    <div class="kicker">Emily Folorunsho · Student access</div>
    <h1>Cold War<br>History Resources</h1>
    <div class="split"><i></i><i></i></div>
    <p class="note">These lessons are for students I tutor. Enter the password I gave you to continue.</p>

    <form id="staticrypt-form" action="#" method="post">
      <label class="field" for="staticrypt-password">Password</label>
      <div class="pw">
        <input id="staticrypt-password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" autofocus>
        <button type="button" id="toggle-pw" aria-label="Show password">Show</button>
      </div>
      <p class="error" id="pw-error" role="alert"></p>

      <label id="staticrypt-remember-label" class="remember hidden">
        <input id="staticrypt-remember" type="checkbox" name="remember" checked>
        Keep me signed in on this device
      </label>

      <input type="submit" class="go" value="Sign in">
    </form>
    <p class="foot">Lost the password? Ask Ms Folorunsho at your next session.</p>
  </main>
</div>
